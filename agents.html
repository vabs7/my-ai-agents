<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agents — 100x100 Colorful Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --text-tertiary: #515154;
      --transition-spring: all 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 520px;
      background: radial-gradient(ellipse at center, rgba(80, 80, 160, 0.18) 0%, rgba(0, 0, 0, 0) 72%);
      pointer-events: none;
      z-index: 0;
      filter: blur(50px);
    }

    .main-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1100px;
      margin: auto 0;
    }

    /* Apple-Style Navigation Top Bar */
    .top-nav {
      margin-bottom: 28px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: var(--transition-spring);
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
    }

    .nav-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.2s ease;
    }

    .nav-btn:hover svg {
      transform: translateX(-3px);
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 46px;
      user-select: none;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #a1a1a6;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
      backdrop-filter: blur(16px);
    }

    .header-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 8px #34c759;
    }

    .header-title {
      font-size: clamp(34px, 5.2vw, 50px);
      font-weight: 700;
      letter-spacing: -0.038em;
      line-height: 1.08;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-subtitle {
      font-size: clamp(14px, 2vw, 16px);
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* 6 Logos per Row Grid — Centered on the Page */
    .grid-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(6, 100px);
      gap: 26px;
      justify-content: center;
      align-items: start;
    }

    /* Agent Tile & 100x100 Logo Card */
    .agent-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100px;
      text-decoration: none;
      position: relative;
    }

    .agent-tile {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition-spring);
      user-select: none;
    }

    /* Apple Specular Top Highlight */
    .agent-tile::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 42%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      border-top-left-radius: inherit;
      border-top-right-radius: inherit;
      transition: opacity 0.3s ease;
    }

    /* Subtle Inner Ambient Glow */
    .agent-tile::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 50% 50%, var(--glow-color, rgba(255, 255, 255, 0.1)), transparent 70%);
      opacity: 0.15;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .agent-tile svg,
    .agent-tile .agent-img {
      width: 48px;
      height: 48px;
      display: block;
      transition: var(--transition-spring);
      position: relative;
      z-index: 1;
    }

    .agent-tile .agent-img {
      object-fit: contain;
    }

    /* Hover Lift & Brand Glow */
    .agent-item:hover .agent-tile {
      transform: translateY(-8px) scale(1.06);
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7), 0 0 32px var(--glow-color, rgba(255, 255, 255, 0.2));
    }

    .agent-item:hover .agent-tile::after {
      opacity: 0.35;
    }

    .agent-item:hover .agent-tile svg,
    .agent-item:hover .agent-tile .agent-img {
      transform: scale(1.08);
    }

    /* Typography: One-Word Agent Name + Subtle Company Label */
    .agent-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 12px;
      text-align: center;
      width: 100%;
      user-select: none;
    }

    .agent-name {
      font-size: 14px;
      font-weight: 600;
      color: #f5f5f7;
      letter-spacing: -0.02em;
      transition: color 0.25s ease;
      white-space: nowrap;
    }

    .agent-company {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin-top: 2px;
      white-space: nowrap;
      transition: color 0.25s ease;
    }

    .agent-item:hover .agent-name {
      color: #ffffff;
    }

    .agent-item:hover .agent-company {
      color: #a1a1a6;
    }

    /* Agent-Specific Brand Colors & Glowing Shadows */
    
    /* 1. Dot (OpenAI) */
    .agent-item.dot { --glow-color: rgba(16, 163, 127, 0.4); }
    .agent-item.dot .agent-tile svg { fill: #10a37f; }

    /* 2. Gem (Google) */
    .agent-item.gem { --glow-color: rgba(84, 104, 255, 0.45); }
    
    /* 3. Claude (Anthropic) */
    .agent-item.claude { --glow-color: rgba(217, 119, 87, 0.45); }
    .agent-item.claude .agent-tile svg { fill: #d97757; }

    /* 4. Copilot (Microsoft) */
    .agent-item.copilot { --glow-color: rgba(16, 157, 242, 0.45); }
    
    /* 5. Muse (Meta) */
    .agent-item.muse { --glow-color: rgba(0, 109, 238, 0.5); }

    /* 6. Siri (Apple) */
    .agent-item.siri { --glow-color: rgba(239, 122, 255, 0.45); }

    /* 7. Alexa (Amazon) */
    .agent-item.alexa { --glow-color: rgba(0, 202, 255, 0.45); }
    .agent-item.alexa .agent-tile svg { fill: #00caff; }

    /* 8. Grok (xAI) */
    .agent-item.grok { --glow-color: rgba(255, 255, 255, 0.4); }

    /* 9. Mistral (Mistral AI) */
    .agent-item.mistral { --glow-color: rgba(255, 112, 0, 0.45); }
    
    /* 10. DeepSeek (DeepSeek) */
    .agent-item.deepseek { --glow-color: rgba(77, 107, 254, 0.45); }
    .agent-item.deepseek .agent-tile svg { fill: #4d6bfe; }

    /* 11. Qwen (Alibaba) */
    .agent-item.qwen { --glow-color: rgba(97, 92, 237, 0.45); }
    .agent-item.qwen .agent-tile svg { fill: #615ced; }

    /* 12. ERNIE (Baidu) */
    .agent-item.ernie { --glow-color: rgba(41, 50, 225, 0.45); }

    /* Footer Note */
    .footer-note {
      margin-top: 50px;
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .footer-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-tertiary);
    }

    /* Responsive Adaptation */
    @media (max-width: 820px) {
      .agents-grid {
        grid-template-columns: repeat(3, 100px);
        gap: 22px;
      }
    }

    @media (max-width: 420px) {
      .agents-grid {
        grid-template-columns: repeat(3, 90px);
        gap: 14px;
      }
      .agent-tile {
        width: 90px;
        height: 90px;
        border-radius: 20px;
      }
      .agent-tile svg {
        width: 42px;
        height: 42px;
      }
      .header-title {
        font-size: 30px;
      }
    }
  </style>
</head>

      <div class="agents-grid" role="list">
